name: Test / Erlang

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-erlang.yml'
      - 'apps/**'
      - 'rebar.config'
      - 'rebar.lock'
      - 'codecov.yml'

  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/test-erlang.yml'
      - 'apps/**'
      - 'rebar.config'
      - 'rebar.lock'
      - 'codecov.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-erlang:
    runs-on: ubuntu-22.04
    env:
      ERL_FLAGS: "-enable-feature all"
      OTP_VERSION: "27"
      REBAR3_VERSION: "3.24.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Erlang/OTP and rebar3
        uses: erlef/setup-beam@0f75c29430f34bb5af4cce5e3b7f6a8860fca236 # v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          rebar3-version: ${{ env.REBAR3_VERSION }}

      - name: Restore _build folder
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: _build
          key: "_build-cache-for\
            -otp-${{ env.OTP_VERSION }}\
            -rebar3-${{ env.REBAR3_VERSION }}\
            -hash-${{ hashFiles('rebar.lock') }}"

      - name: Restore rebar3's cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/rebar3
          key: "rebar3-cache-for\
            -otp-${{ env.OTP_VERSION }}\
            -rebar3-${{ env.REBAR3_VERSION }}\
            -hash-${{ hashFiles('rebar.lock') }}"

      - name: Run EUnit tests
        run: rebar3 eunit --cover

      - name: Generate covertool
        run: rebar3 covertool generate

      - name: Collect coverage files
        id: coverage_files
        run: |
          shopt -s nullglob
          files=(_build/test/covertool/*.covertool.xml)
          printf -v list '%s,' "${files[@]}"
          echo "files=${list%,}" >> "$GITHUB_OUTPUT"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@a99c28d3f0da835de33ff2feb2e15691c7b9641f # v7
        with:
          files: ${{ steps.coverage_files.outputs.files }}
          flags: erlang
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

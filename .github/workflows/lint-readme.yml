name: Lint / Generated README

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lint-readme.yml'
      - '.github/scripts/sync_readme.escript'
      - 'apps/es_xp/examples/demo_bank.script'
      - 'README.md'

  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lint-readme.yml'
      - '.github/scripts/sync_readme.escript'
      - 'apps/es_xp/examples/demo_bank.script'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-readme:
    runs-on: ubuntu-22.04
    env:
      ERL_FLAGS: "-enable-feature all"
      OTP_VERSION: "27"
      REBAR3_VERSION: "3.24.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Erlang/OTP and rebar3
        uses: erlef/setup-beam@0f75c29430f34bb5af4cce5e3b7f6a8860fca236 # v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          rebar3-version: ${{ env.REBAR3_VERSION }}

      - name: Update demo in README.md
        run: escript .github/scripts/sync_readme.escript

      - name: Verify changed README files
        uses: tj-actions/verify-changed-files@a1c6acee9df209257a246f2cc6ae8cb6581c1edf # v20
        id: verify-changed-readme-files
        with:
          files: README.md

      - name: Fail if README.md changed
        if: steps.verify-changed-readme-files.outputs.files_changed == 'true'
        run: |
          echo "README.md has been updated."
          echo "Changed files: ${{ steps.verify-changed-readme-files.outputs.changed_files }}"
          git diff --name-only | grep 'README.md' | while read -r file; do
            echo "Changes in $file:"
            git diff HEAD "$file"
          done
          echo "Generate README with \`escript .github/scripts/sync_readme.escript\` and commit it."
          exit 1
